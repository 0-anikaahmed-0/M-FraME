<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Background card (keeps colors readable in GitHub light and dark themes) -->
  <rect x="0" y="0" width="1200" height="640" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Title -->
  <text x="600" y="68" text-anchor="middle" font-size="46" font-weight="800" fill="#0F172A">M-FraME</text>
  <text x="600" y="102" text-anchor="middle" font-size="20" fill="#475569">Multilingual Framed Medical Evaluation</text>

  <!-- Arrows -->
  <line x1="292" y1="325" x2="328" y2="325" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="582" y1="325" x2="618" y2="325" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="872" y1="325" x2="908" y2="325" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Box 1: source queries -->
  <rect x="40" y="140" width="250" height="360" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="40" y="140" width="250" height="8" rx="4" fill="#2563EB"/>
  <text x="165" y="215" text-anchor="middle" font-size="58" font-weight="800" fill="#2563EB">100</text>
  <text x="165" y="248" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">source queries</text>
  <text x="165" y="300" text-anchor="middle" font-size="16" fill="#475569">Patient-perspective</text>
  <text x="165" y="324" text-anchor="middle" font-size="16" fill="#475569">medical questions from</text>
  <text x="165" y="348" text-anchor="middle" font-size="16" fill="#475569">PatientSafetyBench</text>
  <text x="165" y="420" text-anchor="middle" font-size="15" font-style="italic" fill="#64748B">The underlying request</text>
  <text x="165" y="442" text-anchor="middle" font-size="15" font-style="italic" fill="#64748B">is held constant</text>

  <!-- Box 2: topics -->
  <rect x="330" y="140" width="250" height="360" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="330" y="140" width="250" height="8" rx="4" fill="#0D9488"/>
  <text x="455" y="215" text-anchor="middle" font-size="58" font-weight="800" fill="#0D9488">4</text>
  <text x="455" y="248" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">medical topics</text>
  <g font-size="15" font-weight="600" fill="#134E4A" text-anchor="middle">
    <rect x="350" y="272" width="210" height="36" rx="18" fill="#CCFBF1"/>
    <text x="455" y="295">Dose Adjustment</text>
    <rect x="350" y="320" width="210" height="36" rx="18" fill="#CCFBF1"/>
    <text x="455" y="343">Medication Recommendation</text>
    <rect x="350" y="368" width="210" height="36" rx="18" fill="#CCFBF1"/>
    <text x="455" y="391">Medical Diagnosis</text>
    <rect x="350" y="416" width="210" height="36" rx="18" fill="#CCFBF1"/>
    <text x="455" y="439">Personalized Treatment</text>
  </g>

  <!-- Box 3: framings -->
  <rect x="620" y="140" width="250" height="360" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="620" y="140" width="250" height="8" rx="4" fill="#EA580C"/>
  <text x="745" y="215" text-anchor="middle" font-size="58" font-weight="800" fill="#EA580C">6</text>
  <text x="745" y="248" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">framing conditions</text>
  <g font-size="15" font-weight="600" fill="#7C2D12" text-anchor="middle">
    <rect x="640" y="264" width="210" height="32" rx="16" fill="#FFEDD5"/>
    <text x="745" y="285">Direct</text>
    <rect x="640" y="302" width="210" height="32" rx="16" fill="#FFEDD5"/>
    <text x="745" y="323">Indirect</text>
    <rect x="640" y="340" width="210" height="32" rx="16" fill="#FFEDD5"/>
    <text x="745" y="361">Emotional</text>
    <rect x="640" y="378" width="210" height="32" rx="16" fill="#FFEDD5"/>
    <text x="745" y="399">Hypothetical</text>
    <rect x="640" y="416" width="210" height="32" rx="16" fill="#FFEDD5"/>
    <text x="745" y="437">Random role-play</text>
    <rect x="640" y="454" width="210" height="32" rx="16" fill="#FFEDD5"/>
    <text x="745" y="475">Assigned role-play</text>
  </g>

  <!-- Box 4: languages -->
  <rect x="910" y="140" width="250" height="360" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="910" y="140" width="250" height="8" rx="4" fill="#7C3AED"/>
  <text x="1035" y="215" text-anchor="middle" font-size="58" font-weight="800" fill="#7C3AED">4</text>
  <text x="1035" y="248" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">languages</text>
  <g font-size="15" font-weight="600" fill="#4C1D95" text-anchor="middle">
    <rect x="930" y="272" width="210" height="36" rx="18" fill="#EDE9FE"/>
    <text x="1035" y="295">English</text>
    <rect x="930" y="320" width="210" height="36" rx="18" fill="#EDE9FE"/>
    <text x="1035" y="343">Bangla</text>
    <rect x="930" y="368" width="210" height="36" rx="18" fill="#EDE9FE"/>
    <text x="1035" y="391">Hindi</text>
    <rect x="930" y="416" width="210" height="36" rx="18" fill="#EDE9FE"/>
    <text x="1035" y="439">Urdu</text>
  </g>

  <!-- Bottom summary banner -->
  <rect x="40" y="530" width="1120" height="74" rx="14" fill="#0F172A"/>
  <text x="600" y="577" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">100 queries × 6 framings = 600 rows   →   × 4 languages = 2,400 prompts</text>
</svg>
